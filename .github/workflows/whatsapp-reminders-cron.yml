name: WhatsApp Reminders Processor

on:
  schedule:
    # Every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: whatsapp-reminders-processor
  cancel-in-progress: false

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      WHATSAPP_REMINDER_CRON_SECRET: ${{ secrets.WHATSAPP_REMINDER_CRON_SECRET }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret is missing"
            exit 1
          fi
          if [ -z "${WHATSAPP_REMINDER_CRON_SECRET:-}" ]; then
            echo "::error::WHATSAPP_REMINDER_CRON_SECRET secret is missing"
            exit 1
          fi

      - name: Process WhatsApp reminders
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer ${WHATSAPP_REMINDER_CRON_SECRET}" \
            -H "Accept: application/json" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            "${APP_URL%/}/api/internal/whatsapp-reminders/process")
          echo "$response"
          # Log summary
          sent=$(echo "$response" | jq -r '.sent // 0')
          errors=$(echo "$response" | jq -r '.errors // 0')
          echo "::notice::Sent: ${sent}, Errors: ${errors}"
